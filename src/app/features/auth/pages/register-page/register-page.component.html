<form class="flex flex-column" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
  <h2 class="text-lg mb-2 text-center">Registro</h2>

  <div class="p-fluid">
    <div class="p-field">
      <label for="name">Nombre</label>
      <input id="name" type="text" pInputText placeholder="Nombre" formControlName="name"/>
    </div>

    <div class="p-field mt-3">
      <label for="lastname">Apellido Paterno</label>
      <input id="lastname" type="text" pInputText placeholder="Apellido Paterno" formControlName="lastname"/>
    </div>

    <div class="p-field mt-3">
      <label for="lastname2">Apellido Materno</label>
      <input id="lastname2" type="text" pInputText placeholder="Apellido Materno" formControlName="lastname2"/>
    </div>

    <div class="p-field mt-3">
      <label for="institution">Institución</label>
      <input id="institution" type="text" pInputText placeholder="Institución" formControlName="institution"/>
    </div>

    <div class="p-field mt-3">
      <label for="email">Correo electrónico</label>
      <input id="email" type="text" pInputText placeholder="Correo electrónico" formControlName="email"/>
    </div>

    <div class="p-field mt-3">
      <label for="password">Contraseña</label>
      <small class="ml-1">(Mínimo 6 caracteres)</small>
      <input id="password" type="password" pInputText placeholder="Contraseña" formControlName="password">
    </div>

    <div class="p-field mt-3">
      <label for="password2">Reingresar Contraseña</label>
      <input id="password2" type="password" pInputText placeholder="Reingresar contraseña" formControlName="password2"/>
    </div>

    <button class="mt-3" pButton type="submit">
      <div class="flex align-items-center justify-content-center w-full">
        <span class="material-icons mr-2">save</span>
        <strong>Crear Cuenta</strong>
      </div>
    </button>

    @if(showMessage()){
      <div class="py-3">
        <p-messages [(value)]="messages" />
      </div>
    }

    <div class="flex justify-content-between mt-3">
      <a routerLink="/">Regresar a la plataforma</a>
      <a routerLink="/auth/login">¿Ya tienes cuenta?</a>
    </div>
  </div>

</form>
