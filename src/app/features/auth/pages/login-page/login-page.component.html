<form class="flex flex-column mt-8" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <h2 class="text-lg mb-4 text-center">Login</h2>

  <div class="p-fluid">
    <div class="p-field">
      <label for="email">Correo electrónico</label>
      <input id="email" type="text" pInputText placeholder="Correo electrónico" formControlName="email"/>
    </div>

    <div class="p-field mt-3">
      <label for="password">Contraseña</label>
      <input id="password" type="password" pInputText placeholder="Contraseña" formControlName="password">
    </div>

    <button class="mt-3" pButton type="submit" [disabled]="loginForm.invalid">
      <div class="flex align-items-center justify-content-center w-full">
        <span class="material-icons mr-2">login</span>
        <strong>Ingresar</strong>
      </div>
    </button>

    @if(hasError()){
      <div class="py-3">
        <p-messages [(value)]="messages" />
      </div>
    }

    <div class="flex justify-content-between mt-3">
      <a routerLink="/">Regresar a la plataforma</a>
      <a routerLink="/auth/register">¿No tienes cuenta?</a>
    </div>

  </div>
</form>
