<div class="dialog-container">
  <h2 mat-dialog-title>{{ data.title }}</h2>
  
  <mat-dialog-content class="dialog-content">
    {{ data.message }}
  </mat-dialog-content>
  
  <mat-dialog-actions class="dialog-actions">
    <button mat-button class="cancel-btn" (click)="onNoClick()">
      Cancelar
    </button>
    <button mat-button class="delete-btn" (click)="onYesClick()">
      Eliminar
    </button>
  </mat-dialog-actions>
</div>
