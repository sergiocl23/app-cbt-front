<div class="new-topic-container">
  <h2>Crear Nuevo Tópico</h2>
  
  <div class="form-group">
    <label for="subcategory">Categoría</label>
    <select 
      id="subcategory"
      [(ngModel)]="newTopic.subcategoryId"
      class="form-control">
      <option value="">Seleccione una categoría</option>
      <option *ngFor="let subcategory of subcategories" 
              [value]="subcategory.id">
        {{ subcategory.name }}
      </option>
    </select>
  </div>

  <div class="form-group">
    <label for="title">Título</label>
    <input 
      type="text"
      id="title"
      [(ngModel)]="newTopic.title"
      class="form-control"
      placeholder="¿De qué se trata este tópico?">
  </div>

  <div class="state-toggles">
    <div class="state-toggle">
      <div class="toggle-header">
        <i class="fas fa-lock"></i>
        <div class="toggle-text">
          <span class="toggle-title">Tópico cerrado</span>
          <span class="toggle-description">Si está marcado, no se permitirán nuevas respuestas</span>
        </div>
      </div>
      <label class="switch">
        <input type="checkbox" [(ngModel)]="newTopic.closed">
        <span class="slider"></span>
      </label>
    </div>

    <div class="state-toggle">
      <div class="toggle-header">
        <i class="fas fa-thumbtack"></i>
        <div class="toggle-text">
          <span class="toggle-title">Tópico fijado</span>
          <span class="toggle-description">Si está marcado, el tópico aparecerá al inicio de la lista</span>
        </div>
      </div>
      <label class="switch">
        <input type="checkbox" [(ngModel)]="newTopic.pinned">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="form-group">
    <div class="editor-header">
      <label for="body">Contenido</label>
      <button class="btn-preview" (click)="togglePreview()">
        {{ showPreview ? 'Editar' : 'Vista previa' }}
      </button>
    </div>

    <div class="editor-container">
      <textarea 
        *ngIf="!showPreview"
        id="body"
        [(ngModel)]="newTopic.body"
        (ngModelChange)="updatePreview()"
        class="form-control"
        rows="10"
        placeholder="Escriba aquí usando Markdown para dar formato al texto...">
      </textarea>
      
      <div *ngIf="showPreview" class="markdown-preview markdown-body" [innerHTML]="previewContent"></div>
    </div>

    <div class="markdown-help">
      <small>
        Formato soportado: 
        <code># Título</code>,
        <code>**negrita**</code>,
        <code>*cursiva*</code>,
        <code>- lista</code>,
        <code>[enlace](url)</code>
      </small>
    </div>
  </div>

  <div class="form-actions">
    <button 
      class="btn-cancel"
      (click)="cancelCreate()">
      Cancelar
    </button>
    <button 
      class="btn-create"
      (click)="createTopic()"
      [disabled]="!newTopic.title.trim() || !newTopic.body.trim() || !newTopic.subcategoryId">
      Crear Tópico
    </button>
  </div>
</div>
